<!DOCTYPE html>

<head>

    <meta property="og:type" content="website">

    <meta property="og:description" content="Twelve courses. All free. Begin anytime, no signup.">
    <meta property="og:image" content="https://sukoon.cloud/og/courses.jpg">
    <meta property="og:image:width" content="1200">

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:image" content="https://sukoon.cloud/og/courses.jpg">
    <meta name="theme-color" content="#0F1B3D">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icons/icon-192.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Tiro+Devanagari+Hindi&family=Inter+Tight:wght@400;500;600&family=Hind:wght@400;500&display=swap">
    <link rel="stylesheet" href="/css/shell.css">
    <link rel="stylesheet" href="/css/sukoon-revolution.css">
    <script src="/js/sukoon-tts.js" defer></script>
    <script src="/js/sukoon-engine.js" defer></script>
    <script src="/js/sukoon-library.js" defer></script>
    <script src="/js/sukoon-player.js" defer></script>

    <style>
        /* ============ COURSES — page tokens (scoped) ============ */
        .page-courses {
            --sk-night:        #0F1B3D;
            --sk-twilight:     #1A2547;
            --sk-aubergine:    #2B1F4A;
            --sk-dusk:         #6B3E5E;
            --sk-saffron:      #E8A552;
            --sk-marigold:     #D87A4A;
            --sk-haldi:        #E8C547;
            --sk-tulsi:        #6FA286;
            --sk-rose:         #C77D7D;
            --sk-coral:        #F08679;
            --sk-cream:        #F5EFE2;
            --sk-cream-dim:    rgba(245, 239, 226, 0.72);
            --sk-cream-quiet:  rgba(245, 239, 226, 0.45);
            --sk-mist:         #7FA8A2;
            --sk-shadow:       rgba(8, 12, 28, 0.55);
            --sk-font-serif:   'Fraunces', 'Tiro Devanagari Hindi', Georgia, serif;
            --sk-font-sans:    'Inter Tight', 'Hind', system-ui, sans-serif;
            --sk-font-hindi:   'Tiro Devanagari Hindi', 'Hind', serif;
            --sk-h1: clamp(40px, 6vw, 76px);
            --sk-h2: clamp(28px, 3.8vw, 44px);
            --sk-h3: clamp(20px, 2.2vw, 26px);
            --sk-track-eyebrow: 0.16em;
            background: var(--sk-night);
            color: var(--sk-cream);
            font-family: var(--sk-font-sans);
            min-height: 100vh;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }
        .page-courses *:focus-visible {
            outline: 2px solid var(--sk-saffron);
            outline-offset: 3px;
            border-radius: 6px;
        }
        .courses-shell {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: var(--bottomnav-clearance, 92px);
        }

        /* ============ CRISIS BAR ============ */
        .sk-crisis-bar {
            position: relative;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 8px 16px;
            padding-top: calc(8px + env(safe-area-inset-top));
            background: rgba(201, 56, 56, 0.18);
            border-bottom: 1px solid rgba(240, 134, 121, 0.22);
            font-size: 12.5px;
            color: var(--sk-cream);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .sk-crisis-bar__text { display: inline-flex; align-items: center; gap: 8px; }
        .sk-crisis-bar__dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--sk-coral);
            box-shadow: 0 0 10px rgba(240, 134, 121, 0.7);
            animation: skPulseDot 2.6s ease-in-out infinite;
        }
        .sk-crisis-bar__cta {
            background: var(--sk-coral);
            color: #fff;
            padding: 5px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: background 200ms ease;
        }
        .sk-crisis-bar__cta:hover { background: #ec7264; }

        /* ============ LANG TOGGLE ============ */
        .sk-lang {
            position: absolute;
            top: 56px; right: 18px;
            z-index: 20;
            display: inline-flex;
            background: rgba(43, 31, 74, 0.6);
            border: 1px solid rgba(245, 239, 226, 0.12);
            border-radius: 999px;
            padding: 3px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .sk-lang button {
            background: transparent;
            border: none;
            color: var(--sk-cream-dim);
            font-family: var(--sk-font-sans);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
            padding: 6px 14px;
            border-radius: 999px;
            cursor: pointer;
            transition: background 200ms ease, color 200ms ease;
        }
        .sk-lang button[aria-pressed="true"] {
            background: var(--sk-saffron);
            color: var(--sk-night);
        }

        /* ============ HERO ============ */
        .sk-hero {
            position: relative;
            min-height: 56vh;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 110px 22px 56px;
            overflow: hidden;
            isolation: isolate;
        }
        .sk-hero__video, .sk-hero__poster {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -2;
        }
        .sk-hero__poster { z-index: -3; }
        .sk-hero__veil {
            position: absolute;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(ellipse at 50% 30%, rgba(232, 165, 82, 0.18) 0%, rgba(15,27,61,0) 60%),
                linear-gradient(180deg, rgba(15,27,61,0.45) 0%, rgba(15,27,61,0.78) 60%, rgba(15,27,61,0.97) 100%);
        }
        .sk-hero__inner {
            text-align: center;
            max-width: 760px;
            animation: skFadeUp 1.4s cubic-bezier(0.2, 0.7, 0.2, 1) both;
        }
        .sk-hero__eyebrow {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: var(--sk-track-eyebrow);
            text-transform: uppercase;
            color: var(--sk-saffron);
            margin-bottom: 18px;
        }
        .sk-hero__title {
            font-family: var(--sk-font-serif);
            font-weight: 300;
            font-variation-settings: "opsz" 96;
            font-size: var(--sk-h1);
            line-height: 1.04;
            letter-spacing: -0.022em;
            color: var(--sk-cream);
            margin: 0 0 14px;
        }
        .sk-hero__title em { font-style: italic; color: var(--sk-saffron); }
        .sk-hero__title-hi {
            font-family: var(--sk-font-hindi);
            font-size: clamp(20px, 2.6vw, 30px);
            color: var(--sk-cream-dim);
            margin: 0 0 22px;
            line-height: 1.4;
        }
        .sk-hero__sub {
            font-size: 17px;
            color: var(--sk-cream-dim);
            line-height: 1.6;
            max-width: 560px;
            margin: 0 auto 6px;
        }
        .sk-hero__sub-hi {
            font-family: var(--sk-font-hindi);
            font-size: 15px;
            color: var(--sk-cream-quiet);
            line-height: 1.6;
            margin: 0 auto;
        }
        @keyframes skFadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ============ CATALOG SHELL ============ */
        .catalog {
            position: relative;
            max-width: 1120px;
            width: 100%;
            margin: 0 auto;
            padding: 48px 22px 64px;
        }
        .catalog-section-eyebrow {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: var(--sk-track-eyebrow);
            text-transform: uppercase;
            color: var(--sk-saffron);
            margin-bottom: 14px;
            text-align: center;
        }

        /* ============ FILTER PILLS ============ */
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 36px;
        }
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }
        .filter-pill {
            background: rgba(43, 31, 74, 0.45);
            border: 1px solid rgba(245, 239, 226, 0.10);
            color: var(--sk-cream-dim);
            font-family: var(--sk-font-sans);
            font-size: 12.5px;
            font-weight: 500;
            letter-spacing: 0.02em;
            padding: 8px 16px;
            border-radius: 999px;
            cursor: pointer;
            transition: background 200ms ease, color 200ms ease, border-color 200ms ease;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        .filter-pill:hover {
            color: var(--sk-cream);
            border-color: rgba(245, 239, 226, 0.22);
        }
        .filter-pill[aria-pressed="true"] {
            background: var(--sk-saffron);
            color: var(--sk-night);
            border-color: var(--sk-saffron);
        }
        .filter-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: var(--sk-track-eyebrow);
            text-transform: uppercase;
            color: var(--sk-cream-quiet);
            text-align: center;
            margin-bottom: 4px;
        }

        /* ============ FEATURED "START HERE" CARD ============ */
        .featured-card {
            position: relative;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            background: linear-gradient(135deg, rgba(232, 165, 82, 0.10) 0%, rgba(127, 168, 162, 0.08) 100%);
            border: 1px solid rgba(232, 165, 82, 0.30);
            border-radius: 24px;
            padding: 36px 32px;
            margin-bottom: 40px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 240ms cubic-bezier(0.2, 0.7, 0.2, 1), border-color 240ms ease, box-shadow 240ms ease;
        }
        .featured-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 100% 0%, rgba(232, 165, 82, 0.18) 0%, rgba(15,27,61,0) 55%);
            pointer-events: none;
        }
        .featured-card:hover {
            transform: translateY(-3px);
            border-color: rgba(232, 165, 82, 0.55);
            box-shadow: 0 24px 60px rgba(8, 12, 28, 0.45);
        }
        .featured-card__eyebrow {
            position: relative;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: var(--sk-track-eyebrow);
            text-transform: uppercase;
            color: var(--sk-saffron);
            margin-bottom: 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .featured-card__star { display: inline-block; width: 14px; height: 14px; }
        .featured-card__title {
            position: relative;
            font-family: var(--sk-font-serif);
            font-weight: 300;
            font-variation-settings: "opsz" 96;
            font-size: clamp(28px, 4.2vw, 44px);
            line-height: 1.08;
            letter-spacing: -0.016em;
            color: var(--sk-cream);
            margin: 0 0 8px;
        }
        .featured-card__title-hi {
            position: relative;
            font-family: var(--sk-font-hindi);
            font-size: clamp(18px, 2.2vw, 24px);
            color: var(--sk-cream-dim);
            margin: 0 0 18px;
            line-height: 1.4;
        }
        .featured-card__sub {
            position: relative;
            font-size: 15.5px;
            color: var(--sk-cream-dim);
            line-height: 1.65;
            max-width: 580px;
            margin: 0 0 22px;
        }
        .featured-card__meta {
            position: relative;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 26px;
        }
        .featured-card__meta-item {
            font-size: 12px;
            color: var(--sk-cream-quiet);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .featured-card__meta-item strong { color: var(--sk-cream); font-weight: 500; }
        .featured-card__cta {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 13px 26px;
            border-radius: 999px;
            background: var(--sk-saffron);
            color: var(--sk-night);
            font-family: var(--sk-font-sans);
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.02em;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: background 200ms ease, transform 200ms ease;
        }
        .featured-card__cta:hover { background: #f0b265; transform: translateY(-1px); }

        /* ============ COURSE GRID ============ */
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 22px;
        }
        @media (max-width: 700px) {
            .courses-grid { grid-template-columns: 1fr; }
        }

        .course-card {
            position: relative;
            display: flex;
            flex-direction: column;
            background: rgba(43, 31, 74, 0.42);
            border: 1px solid rgba(245, 239, 226, 0.08);
            border-radius: 20px;
            padding: 28px 26px 26px;
            cursor: pointer;
            overflow: hidden;
            transition: transform 240ms cubic-bezier(0.2, 0.7, 0.2, 1), border-color 240ms ease, box-shadow 240ms ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .course-card:hover {
            transform: translateY(-3px);
            border-color: rgba(232, 165, 82, 0.32);
            box-shadow: 0 18px 50px rgba(8, 12, 28, 0.4);
        }
        .course-card.is-hidden { display: none; }
        .course-card__accent {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--sk-saffron);
            opacity: 0.7;
        }
        .course-card__head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
            gap: 12px;
        }
        .course-card__days {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: var(--sk-track-eyebrow);
            text-transform: uppercase;
            color: var(--sk-saffron);
            background: rgba(232, 165, 82, 0.12);
            border: 1px solid rgba(232, 165, 82, 0.30);
            padding: 4px 10px;
            border-radius: 999px;
            white-space: nowrap;
        }
        .course-card__level {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: var(--sk-track-eyebrow);
            text-transform: uppercase;
            color: var(--sk-cream-quiet);
        }
        .course-card__title {
            font-family: var(--sk-font-serif);
            font-weight: 400;
            font-variation-settings: "opsz" 96;
            font-size: clamp(20px, 2.4vw, 26px);
            line-height: 1.18;
            color: var(--sk-cream);
            margin: 0 0 6px;
        }
        .course-card__title-hi {
            font-family: var(--sk-font-hindi);
            font-size: 14.5px;
            color: var(--sk-cream-dim);
            margin: 0 0 14px;
            line-height: 1.45;
        }
        .course-card__sub {
            font-size: 13.5px;
            color: var(--sk-cream-dim);
            line-height: 1.6;
            margin: 0 0 18px;
            flex: 1;
        }
        .course-card__progress {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .course-card__progress-bar {
            flex: 1;
            height: 3px;
            background: rgba(245, 239, 226, 0.10);
            border-radius: 999px;
            overflow: hidden;
        }
        .course-card__progress-fill {
            height: 100%;
            background: var(--sk-saffron);
            border-radius: 999px;
            transition: width 400ms ease;
        }
        .course-card__progress-text {
            font-size: 11px;
            color: var(--sk-cream-quiet);
            white-space: nowrap;
        }
        .course-card__footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .course-card__focus {
            font-size: 11px;
            font-weight: 500;
            color: var(--sk-cream-quiet);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .course-card__btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 16px;
            border-radius: 999px;
            background: transparent;
            border: 1px solid rgba(245, 239, 226, 0.22);
            color: var(--sk-cream);
            font-family: var(--sk-font-sans);
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: background 200ms ease, border-color 200ms ease;
        }
        .course-card__btn:hover {
            background: rgba(232, 165, 82, 0.14);
            border-color: var(--sk-saffron);
        }
        .course-card__btn svg { width: 12px; height: 12px; }

        /* ============ EMPTY STATE ============ */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--sk-cream-dim);
            font-family: var(--sk-font-serif);
            font-size: 18px;
            font-style: italic;
        }

        /* ============ LOADING STATE ============ */
        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--sk-cream-quiet);
            font-size: 14px;
        }
        .loading-state__dot {
            display: inline-block;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--sk-saffron);
            margin: 0 3px;
            animation: skLoadingDot 1.4s ease-in-out infinite;
        }
        .loading-state__dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-state__dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes skLoadingDot {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1.1); }
        }

        /* ============ DETAIL VIEW ============ */
        .detail {
            max-width: 920px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 22px 80px;
            animation: skFadeUp 600ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
        }
        .detail__back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 28px;
            background: transparent;
            border: 1px solid rgba(245, 239, 226, 0.18);
            color: var(--sk-cream-dim);
            padding: 9px 18px;
            border-radius: 999px;
            font-family: var(--sk-font-sans);
            font-size: 12.5px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: background 200ms ease, color 200ms ease, border-color 200ms ease;
        }
        .detail__back:hover {
            color: var(--sk-cream);
            border-color: rgba(245, 239, 226, 0.34);
            background: rgba(245, 239, 226, 0.04);
        }
        .detail__back svg { width: 14px; height: 14px; }

        .detail__hero { margin-bottom: 36px; }
        .detail__progress-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(232, 165, 82, 0.14);
            border: 1px solid rgba(232, 165, 82, 0.40);
            color: var(--sk-saffron);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 5px 14px;
            border-radius: 999px;
            margin-bottom: 16px;
        }
        .detail__progress-badge::before {
            content: '';
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--sk-saffron);
            box-shadow: 0 0 8px rgba(232, 165, 82, 0.6);
        }
        .detail__title {
            font-family: var(--sk-font-serif);
            font-weight: 300;
            font-variation-settings: "opsz" 96;
            font-size: clamp(34px, 5.6vw, 64px);
            line-height: 1.05;
            letter-spacing: -0.020em;
            color: var(--sk-cream);
            margin: 0 0 10px;
        }
        .detail__title-hi {
            font-family: var(--sk-font-hindi);
            font-size: clamp(20px, 2.6vw, 28px);
            color: var(--sk-cream-dim);
            margin: 0 0 20px;
            line-height: 1.45;
        }
        .detail__sub {
            font-size: 17px;
            color: var(--sk-cream-dim);
            line-height: 1.65;
            margin: 0 0 22px;
            max-width: 640px;
        }
        .detail__sub-hi {
            font-family: var(--sk-font-hindi);
            font-size: 15.5px;
            color: var(--sk-cream-quiet);
            line-height: 1.7;
            margin: 0 0 24px;
            max-width: 640px;
        }
        .detail__meta {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            padding: 18px 0;
            border-top: 1px solid rgba(245, 239, 226, 0.10);
            border-bottom: 1px solid rgba(245, 239, 226, 0.10);
            margin-bottom: 36px;
        }
        .detail__meta-item { display: inline-flex; flex-direction: column; gap: 2px; }
        .detail__meta-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: var(--sk-track-eyebrow);
            text-transform: uppercase;
            color: var(--sk-cream-quiet);
        }
        .detail__meta-val {
            font-family: var(--sk-font-serif);
            font-size: 18px;
            color: var(--sk-cream);
            font-weight: 400;
        }

        .detail__intro { margin-bottom: 44px; }
        .detail__intro p {

    <script>
    (function () {
        'use strict';

        /* =========================================================
         * NOTE: All dynamic content rendered below is sourced from

         * rendered). Every interpolation passes through escapeHTML()
         * or escapeAttr() before being placed into a template string.
         * The DOM is constructed with createElement/appendChild and
         * textContent in helper builders; the few sites that compose
         * larger fragments do so via template strings whose values

            var n = document.createElement(tag);
            if (attrs) for (var k in attrs) {
                if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
                if (k === 'class') n.className = attrs[k];
                else if (k === 'text') n.textContent = attrs[k];

                else if (attrs[k] != null) n.setAttribute(k, attrs[k]);
            }
            if (text != null) n.textContent = text;
            return n;
        }
        function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
        function escapeHTML(s) {
            if (s == null) return '';
            return String(s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function escapeAttr(s) { return escapeHTML(s); }
        function truncate(s, n) {
            s = String(s || '');
            if (s.length <= n) return s;
            return s.slice(0, n - 1).replace(/\s+\S*$/, '') + '…';
        }

        /* ============ LANGUAGE TOGGLE ============ */
        var body = document.body;
        var langButtons = document.querySelectorAll('[data-lang-set]');
        function applyLang(lang) {
            body.setAttribute('data-lang', lang);
            document.documentElement.setAttribute('lang', lang);
            langButtons.forEach(function (btn) {
                btn.setAttribute('aria-pressed', btn.getAttribute('data-lang-set') === lang ? 'true' : 'false');
            });
            // textContent only — never innerHTML. The hero <em> is preserved by
            // putting the en/hi text on <span> / <em> children that each carry
            // their own data-lang-en / data-lang-hi attribute (see hero markup).
            document.querySelectorAll('[data-lang-en][data-lang-hi]').forEach(function (n) {
                var t = n.getAttribute('data-lang-' + lang);
                if (t != null) n.textContent = t;
            });
            try { localStorage.setItem('sk_lang', lang); } catch (_) {}
            if (window.__sukoonCoursesMount) window.__sukoonCoursesMount();
        }
        langButtons.forEach(function (btn) {
            btn.addEventListener('click', function () { applyLang(btn.getAttribute('data-lang-set')); });
        });
        var savedLang = null;
        try { savedLang = localStorage.getItem('sk_lang'); } catch (_) {}
        applyLang(savedLang === 'hi' ? 'hi' : 'en');

        /* ============ STORAGE HELPERS ============ */
        function readJSON(key, fallback) {
            try {
                var s = localStorage.getItem(key);
                if (!s) return fallback;
                return JSON.parse(s);
            } catch (_) { return fallback; }
        }
        function writeJSON(key, val) {
            try { localStorage.setItem(key, JSON.stringify(val)); } catch (_) {}
        }

        /* ============ PROGRESS STATE ============ */
        function getAllProgress() { return readJSON('sukoon_course_progress', {}) || {}; }
        function getProgress(courseId) {
            var all = getAllProgress();
            return all[courseId] || null;
        }
        function setProgress(courseId, patch) {
            var all = getAllProgress();
            var cur = all[courseId] || { courseId: courseId, lastDay: 0, completedDays: [], startedAt: null };
            Object.keys(patch).forEach(function (k) { cur[k] = patch[k]; });
            all[courseId] = cur;
            writeJSON('sukoon_course_progress', all);
            return cur;
        }
        function markDayComplete(courseId, day) {
            var p = getProgress(courseId) || { courseId: courseId, lastDay: 0, completedDays: [], startedAt: new Date().toISOString() };
            if (!p.startedAt) p.startedAt = new Date().toISOString();
            if (p.completedDays.indexOf(day) === -1) p.completedDays.push(day);
            p.lastDay = Math.max(p.lastDay || 0, day);
            return setProgress(courseId, p);
        }

        /* ============ JOURNAL ============ */
        function saveJournalEntry(entry) {
            var entries = readJSON('sukoon_journal_entries', []);
            if (!Array.isArray(entries)) entries = [];
            entries.unshift(entry);
            writeJSON('sukoon_journal_entries', entries);
        }

        /* ============ DATA ============ */
        var COURSE_FILES = [
            '/content/courses-foundational.json',
            '/content/courses-specialized.json',
            '/content/courses-therapeutic.json'  /* tolerated if missing */
        ];
        function fetchJSONSoft(url) {
            return fetch(url, { credentials: 'same-origin' })
                .then(function (r) { return r.ok ? r.json() : null; })
                .catch(function () { return null; });
        }
        function loadCourses() {
            return Promise.all(COURSE_FILES.map(fetchJSONSoft)).then(function (chunks) {
                var merged = [];
                chunks.forEach(function (c) { if (Array.isArray(c)) merged = merged.concat(c); });
                return merged;
            });
        }

        /* ============ TEXT HELPERS ============ */
        function currentLang() { return body.getAttribute('data-lang') || 'en'; }
        function pick(obj, key) {
            var lang = currentLang();
            return obj[key + '_' + lang] || obj[key + '_en'] || obj[key] || '';
        }
        function fmtMinutes(min) {
            if (!min) return '';
            return currentLang() === 'hi' ? (min + ' मिनट') : (min + ' min');
        }
        function fmtSeconds(sec) {
            if (!sec) return '';
            var m = Math.round(sec / 60);
            return fmtMinutes(m);
        }
        function focusLabel(tag) {
            var en = {
                'foundations': 'Foundations', 'morning': 'Morning practice', 'sutras': 'Philosophy',
                'pranayama': 'Pranayama', 'desk-recovery': 'Therapeutic', 'postnatal': 'Therapeutic',
                'sleep': 'Sleep', 'anxiety': 'Therapeutic'
            };
            var hi = {
                'foundations': 'नींव', 'morning': 'सुबह का अभ्यास', 'sutras': 'दर्शन',
                'pranayama': 'प्राणायाम', 'desk-recovery': 'चिकित्सीय', 'postnatal': 'चिकित्सीय',
                'sleep': 'नींद', 'anxiety': 'चिकित्सीय'
            };
            var m = currentLang() === 'hi' ? hi : en;
            return m[tag] || tag || '';
        }
        function levelLabel(level) {
            var map = {
                'beginner':     { en: 'Beginner',     hi: 'शुरुआती' },
                'intermediate': { en: 'Intermediate', hi: 'मध्यवर्ती' },
                'advanced':     { en: 'Advanced',     hi: 'उन्नत' },
                'all':          { en: 'All levels',   hi: 'सभी स्तर' }
            };
            var entry = map[level] || map['all'];
            return entry[currentLang()] || entry.en;
        }

        /* ============ COMPONENT META ============ */
        var COMPONENT_META = {
            'asana_sequence': { en: 'Asana sequence', hi: 'आसन क्रम',
                svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6" r="2.5"/><path d="M12 9v6"/><path d="M7 15l5 5 5-5"/></svg>' },

            'meditation': { en: 'Meditation', hi: 'ध्यान',

            'breath': { en: 'Breath', hi: 'साँस',
                svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c4 3 4 7 0 9-4 2-4 6 0 9"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>' },
            'pranayama': { en: 'Pranayama', hi: 'प्राणायाम',

            'philosophy': { en: 'Reading', hi: 'पाठ',

            'reading': { en: 'Reading', hi: 'पाठ',
                svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>' },
            'nidra': { en: 'Yoga Nidra', hi: 'योग निद्रा',
                svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>' },
            'story': { en: 'Story', hi: 'कहानी',
                svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>' },
            'mantra': { en: 'Mantra', hi: 'मंत्र',
                svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>' }
        };
        function componentMeta(type) {
            return COMPONENT_META[type] || {
                en: 'Practice', hi: 'अभ्यास',
                svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/></svg>'
            };
        }

        /* ============ RECOMMENDATION ============ */
        function recommendCourseId(courses) {
            var progress = getAllProgress();
            var inProgress = Object.keys(progress).filter(function (id) {
                var p = progress[id];
                var course = courses.find(function (c) { return c.id === id; });
                if (!course) return false;
                return p.completedDays && p.completedDays.length > 0 && p.completedDays.length < course.days;
            });
            if (inProgress.length) {
                inProgress.sort(function (a, b) {
                    return new Date(progress[b].startedAt || 0) - new Date(progress[a].startedAt || 0);
                });
                return inProgress[0];
            }
            if (courses.find(function (c) { return c.id === '7-days-of-sukoon'; })) return '7-days-of-sukoon';
            var beginner = courses.filter(function (c) { return c.level === 'beginner'; })
                                  .sort(function (a, b) { return (a.days || 999) - (b.days || 999); });
            return beginner.length ? beginner[0].id : (courses[0] && courses[0].id);
        }

        /* ============ FILTERS ============ */
        var FILTERS = { duration: 'all', focus: 'all', level: 'all' };
        function inDuration(c) {
            if (FILTERS.duration === 'all') return true;
            var d = c.days || 0;
            if (FILTERS.duration === 'short')  return d >= 3 && d <= 7;
            if (FILTERS.duration === 'medium') return d >= 8 && d <= 21;
            if (FILTERS.duration === 'long')   return d >= 22;
            return true;
        }
        function inFocus(c) {
            if (FILTERS.focus === 'all') return true;
            if (FILTERS.focus === 'foundations') return c.focus_tag === 'foundations' || c.focus_tag === 'morning' || c.focus_tag === 'sutras';
            if (FILTERS.focus === 'therapeutic') return c.focus_tag === 'desk-recovery' || c.focus_tag === 'postnatal' || c.focus_tag === 'anxiety' || c.focus_tag === 'sleep';
            if (FILTERS.focus === 'specialized') return c.focus_tag === 'pranayama' || c.focus_tag === 'philosophy';
            return true;
        }
        function inLevel(c) {
            if (FILTERS.level === 'all') return true;
            return c.level === FILTERS.level;
        }

        /* ============ RENDER: CATALOG ============ */
        function renderCatalog(courses) {
            var lang = currentLang();
            var main = document.getElementById('coursesMain');
            clear(main);

            var wrap = el('div', { class: 'catalog' });

            /* FILTER GROUP */
            var filterGroup = el('div', { class: 'filter-group', role: 'group', 'aria-label': lang === 'hi' ? 'फ़िल्टर' : 'Filters' });
            function makeFilterRow(dim, opts, label) {
                filterGroup.appendChild(el('div', { class: 'filter-label', text: label }));
                var row = el('div', { class: 'filter-row', 'data-filter-group': dim });
                opts.forEach(function (o) {
                    var btn = el('button', {
                        type: 'button', class: 'filter-pill',
                        'data-filter-val': o.v,
                        'aria-pressed': FILTERS[dim] === o.v ? 'true' : 'false',
                        text: lang === 'hi' ? o.hi : o.en
                    });
                    row.appendChild(btn);
                });
                filterGroup.appendChild(row);
            }
            makeFilterRow('duration', [
                { v: 'all',    en: 'All',         hi: 'सब' },
                { v: 'short',  en: '3–7 days',    hi: '3–7 दिन' },
                { v: 'medium', en: '14–21 days',  hi: '14–21 दिन' },
                { v: 'long',   en: '30 days',     hi: '30 दिन' }
            ], lang === 'hi' ? 'अवधि' : 'Duration');
            makeFilterRow('focus', [
                { v: 'all',          en: 'All',           hi: 'सब' },
                { v: 'foundations',  en: 'Foundations',   hi: 'नींव' },
                { v: 'therapeutic',  en: 'Therapeutic',   hi: 'चिकित्सीय' },
                { v: 'specialized',  en: 'Specialized',   hi: 'विशेष' }
            ], lang === 'hi' ? 'फ़ोकस' : 'Focus');
            makeFilterRow('level', [
                { v: 'all',          en: 'All',          hi: 'सब' },
                { v: 'beginner',     en: 'Beginner',     hi: 'शुरुआती' },
                { v: 'intermediate', en: 'Intermediate', hi: 'मध्यवर्ती' },
                { v: 'advanced',     en: 'Advanced',     hi: 'उन्नत' }
            ], lang === 'hi' ? 'स्तर' : 'Level');
            wrap.appendChild(filterGroup);

            /* FEATURED CARD */
            var recommendedId = recommendCourseId(courses);
            var recommended = courses.find(function (c) { return c.id === recommendedId; });
            var others = courses.filter(function (c) { return c.id !== recommendedId; });
            if (recommended) {
                var hasStarted = !!(getProgress(recommended.id) && getProgress(recommended.id).completedDays.length > 0);
                wrap.appendChild(buildFeaturedCard(recommended, hasStarted));
            }

            /* GRID */
            wrap.appendChild(el('div', {
                class: 'catalog-section-eyebrow',
                text: lang === 'hi' ? 'सभी कोर्स' : 'All courses'
            }));
            var grid = el('div', { class: 'courses-grid', id: 'coursesGrid' });
            others.forEach(function (course) { grid.appendChild(buildCard(course)); });
            wrap.appendChild(grid);

            /* EMPTY */
            var empty = el('div', {
                class: 'empty-state', id: 'emptyState', style: 'display:none',
                text: lang === 'hi'
                    ? 'इन फ़िल्टरों से कोई कोर्स नहीं मिला। फ़िल्टर साफ़ करें या कुछ और आज़माएँ।'
                    : 'No courses match these filters. Try clearing them or something else.'
            });
            wrap.appendChild(empty);

            main.appendChild(wrap);

            /* WIRE filters */
            wrap.querySelectorAll('[data-filter-group]').forEach(function (group) {
                var dim = group.getAttribute('data-filter-group');
                group.querySelectorAll('.filter-pill').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        FILTERS[dim] = btn.getAttribute('data-filter-val');
                        group.querySelectorAll('.filter-pill').forEach(function (b) {
                            b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
                        });
                        applyFilters(others);
                    });
                });
            });

            /* WIRE card clicks */
            wrap.querySelectorAll('[data-course-id]').forEach(function (n) {
                n.addEventListener('click', function () {
                    navigateToCourse(n.getAttribute('data-course-id'));
                });
                n.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        navigateToCourse(n.getAttribute('data-course-id'));
                    }
                });
            });
        }

        function buildFeaturedCard(course, hasStarted) {
            var lang = currentLang();
            var progress = getProgress(course.id);
            var totalDays = course.days || (course.sessions ? course.sessions.length : 0);
            var doneDays = progress && progress.completedDays ? progress.completedDays.length : 0;
            var nextDay = hasStarted ? Math.min((progress.lastDay || 0) + 1, totalDays) : 1;
            var ctaLabel = hasStarted
                ? (lang === 'hi' ? 'जारी रखें — दिन ' + nextDay : 'Continue — Day ' + nextDay)
                : (lang === 'hi' ? 'यहाँ से शुरू करें' : 'Start here');

            var card = el('article', {
                class: 'featured-card', 'data-course-id': course.id, tabindex: '0', role: 'button',
                'aria-label': pick(course, 'title')
            });

            var eyebrow = el('div', { class: 'featured-card__eyebrow' });
            eyebrow.appendChild(el('span', {
                class: 'featured-card__star',
                'aria-hidden': 'true',
                html: '<svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8 5.8 21.3l2.4-7.4L2 9.4h7.6z"/></svg>'
            }));
            eyebrow.appendChild(document.createTextNode(
                hasStarted
                    ? (lang === 'hi' ? 'आपका कोर्स' : 'Your course in progress')
                    : (lang === 'hi' ? 'यहाँ से शुरू करें' : 'Start here')
            ));
            card.appendChild(eyebrow);

            card.appendChild(el('h2', { class: 'featured-card__title', text: pick(course, 'title') }));
            if (course.title_hi && lang === 'en' && pick(course, 'title') !== course.title_hi) {
                card.appendChild(el('p', { class: 'featured-card__title-hi', lang: 'hi', text: course.title_hi }));
            }
            card.appendChild(el('p', { class: 'featured-card__sub', text: pick(course, 'subtitle') }));

            var meta = el('div', { class: 'featured-card__meta' });
            function metaItem(label, value, strongFirst) {
                var item = el('span', { class: 'featured-card__meta-item' });
                if (strongFirst) {
                    item.appendChild(el('strong', { text: value }));
                    item.appendChild(document.createTextNode(' ' + label));
                } else {
                    item.appendChild(document.createTextNode(label));
                }
                meta.appendChild(item);
                return item;
            }
            metaItem(lang === 'hi' ? 'दिन' : 'days', String(totalDays), true);
            metaItem(levelLabel(course.level));
            var minsItem = el('span', { class: 'featured-card__meta-item' });
            minsItem.appendChild(document.createTextNode('~ '));
            minsItem.appendChild(el('strong', { text: String(course.estimated_daily_minutes || 10) }));
            minsItem.appendChild(document.createTextNode(' ' + (lang === 'hi' ? 'मिनट प्रतिदिन' : 'min/day')));
            meta.appendChild(minsItem);
            if (hasStarted) {
                var pItem = el('span', { class: 'featured-card__meta-item' });
                pItem.appendChild(el('strong', { text: doneDays + ' / ' + totalDays }));
                pItem.appendChild(document.createTextNode(' ' + (lang === 'hi' ? 'पूरे' : 'complete')));
                meta.appendChild(pItem);
            }
            card.appendChild(meta);

            var cta = el('button', { class: 'featured-card__cta', type: 'button' });
            cta.appendChild(document.createTextNode(ctaLabel));
            cta.appendChild(el('span', {
                'aria-hidden': 'true',
                html: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 5l7 7-7 7"/></svg>'
            }));
            card.appendChild(cta);

            return card;
        }

        function buildCard(course) {
            var lang = currentLang();
            var progress = getProgress(course.id);
            var totalDays = course.days || (course.sessions ? course.sessions.length : 0);
            var doneDays = progress && progress.completedDays ? progress.completedDays.length : 0;
            var pct = totalDays ? Math.round((doneDays / totalDays) * 100) : 0;
            var hasStarted = doneDays > 0;
            var ctaLabel = hasStarted
                ? (lang === 'hi' ? 'जारी रखें' : 'Continue')
                : (lang === 'hi' ? 'शुरू करें' : 'Begin');

            var card = el('article', {
                class: 'course-card', 'data-course-id': course.id,
                'data-days': String(course.days || 0),
                'data-level': course.level || '',
                'data-focus': course.focus_tag || '',
                tabindex: '0', role: 'button'
            });
            card.appendChild(el('div', { class: 'course-card__accent', 'aria-hidden': 'true' }));
            var head = el('div', { class: 'course-card__head' });
            head.appendChild(el('span', {
                class: 'course-card__days',
                text: totalDays + ' ' + (lang === 'hi' ? 'दिन' : (totalDays === 1 ? 'day' : 'days'))
            }));
            head.appendChild(el('span', { class: 'course-card__level', text: levelLabel(course.level) }));
            card.appendChild(head);

            card.appendChild(el('h3', { class: 'course-card__title', text: pick(course, 'title') }));
            if (course.title_hi && lang === 'en') {
                card.appendChild(el('p', { class: 'course-card__title-hi', lang: 'hi', text: course.title_hi }));
            }
            card.appendChild(el('p', { class: 'course-card__sub', text: truncate(pick(course, 'subtitle'), 140) }));

            if (hasStarted) {
                var pr = el('div', { class: 'course-card__progress', 'aria-label': doneDays + ' of ' + totalDays + ' days complete' });
                var bar = el('div', { class: 'course-card__progress-bar' });
                bar.appendChild(el('div', { class: 'course-card__progress-fill', style: 'width:' + pct + '%' }));
                pr.appendChild(bar);
                pr.appendChild(el('span', { class: 'course-card__progress-text', text: doneDays + '/' + totalDays }));
                card.appendChild(pr);
            }

            var footer = el('div', { class: 'course-card__footer' });
            footer.appendChild(el('span', { class: 'course-card__focus', text: focusLabel(course.focus_tag) }));
            var btn = el('button', { class: 'course-card__btn', type: 'button' });
            btn.appendChild(document.createTextNode(ctaLabel));
            btn.appendChild(el('span', {
                'aria-hidden': 'true',
                html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12"><path d="M5 12h14"/><path d="M13 5l7 7-7 7"/></svg>'
            }));
            footer.appendChild(btn);
            card.appendChild(footer);
            return card;
        }

        function applyFilters(others) {
            var grid = document.getElementById('coursesGrid');
            if (!grid) return;
            var any = 0;
            grid.querySelectorAll('.course-card').forEach(function (card) {
                var id = card.getAttribute('data-course-id');
                var course = others.find(function (c) { return c.id === id; });
                if (!course) return;
                var ok = inDuration(course) && inFocus(course) && inLevel(course);
                card.classList.toggle('is-hidden', !ok);
                if (ok) any++;
            });
            var empty = document.getElementById('emptyState');
            if (empty) empty.style.display = any === 0 ? 'block' : 'none';
        }

        /* ============ RENDER: DETAIL ============ */
        function renderDetail(course) {
            var lang = currentLang();
            var main = document.getElementById('coursesMain');
            clear(main);
            var totalDays = course.days || (course.sessions ? course.sessions.length : 0);
            var progress = getProgress(course.id);
            var doneDays = progress && progress.completedDays ? progress.completedDays.slice() : [];
            var lastDay = progress ? (progress.lastDay || 0) : 0;
            var nextDay = doneDays.length > 0 ? Math.min(lastDay + 1, totalDays) : 1;

            var detail = el('div', { class: 'detail' });

            /* BACK */
            var back = el('a', {
                class: 'detail__back', href: '/courses.html', 'data-back-link': 'true'
            });
            back.appendChild(el('span', {
                'aria-hidden': 'true',
                html: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 19l-7-7 7-7"/></svg>'
            }));
            back.appendChild(document.createTextNode(lang === 'hi' ? 'सभी कोर्स' : 'All courses'));
            detail.appendChild(back);

            /* HERO */
            var hero = el('header', { class: 'detail__hero' });
            if (doneDays.length > 0) {
                hero.appendChild(el('div', {
                    class: 'detail__progress-badge',
                    text: lang === 'hi' ? 'दिन ' + nextDay + ' / ' + totalDays : 'Day ' + nextDay + ' of ' + totalDays
                }));
            }
            hero.appendChild(el('h1', { class: 'detail__title', text: pick(course, 'title') }));
            if (course.title_hi && lang === 'en') {
                hero.appendChild(el('p', { class: 'detail__title-hi', lang: 'hi', text: course.title_hi }));
            }
            hero.appendChild(el('p', { class: 'detail__sub', text: pick(course, 'subtitle') }));

            var meta = el('div', { class: 'detail__meta' });
            function metaCell(label, value) {
                var cell = el('div', { class: 'detail__meta-item' });
                cell.appendChild(el('span', { class: 'detail__meta-label', text: label }));
                cell.appendChild(el('span', { class: 'detail__meta-val', text: value }));
                meta.appendChild(cell);
            }
            metaCell(lang === 'hi' ? 'अवधि' : 'Duration', totalDays + ' ' + (lang === 'hi' ? 'दिन' : 'days'));
            metaCell(lang === 'hi' ? 'स्तर' : 'Level', levelLabel(course.level));
            metaCell(lang === 'hi' ? 'प्रतिदिन' : 'Daily', '~ ' + (course.estimated_daily_minutes || 10) + ' ' + (lang === 'hi' ? 'मिनट' : 'min'));
            metaCell(lang === 'hi' ? 'फ़ोकस' : 'Focus', focusLabel(course.focus_tag));
            hero.appendChild(meta);
            detail.appendChild(hero);

            /* INTRO */
            var introEn = course.intro_en || '';
            var introHi = course.intro_hi || '';
            if (introEn || introHi) {
                var intro = el('section', { class: 'detail__intro', id: 'detailIntro' });
                if (introEn && introHi) {
                    var toggle = el('div', { class: 'detail__intro-toggle', role: 'group', 'aria-label': 'Intro language' });
                    var enBtn = el('button', { type: 'button', 'data-intro-lang': 'en', 'aria-pressed': 'true', text: 'EN' });
                    var hiBtn = el('button', { type: 'button', 'data-intro-lang': 'hi', 'aria-pressed': 'false', text: 'हिं' });
                    toggle.appendChild(enBtn); toggle.appendChild(hiBtn);
                    intro.appendChild(toggle);
                }
                var bodyEn = el('div', { 'data-intro-body': 'en' });
                appendParagraphs(bodyEn, introEn);
                intro.appendChild(bodyEn);
                if (introHi) {
                    var bodyHi = el('div', { class: 'detail__intro-hi', 'data-intro-body': 'hi', style: 'display:none' });
                    appendParagraphs(bodyHi, introHi);
                    intro.appendChild(bodyHi);
                }
                detail.appendChild(intro);
            }

            /* TIMELINE */
            detail.appendChild(el('div', {
                class: 'timeline-header',
                text: lang === 'hi' ? 'दिन-दर-दिन' : 'Day by day'
            }));
            var timeline = el('div', { class: 'timeline' });
            (course.sessions || []).forEach(function (session) {
                timeline.appendChild(buildSessionRow(course, session, doneDays, nextDay));
            });
            detail.appendChild(timeline);

            /* CLOSING */
            if (doneDays.length >= totalDays && totalDays > 0) {
                var close = el('section', { class: 'closing-message' });
                close.appendChild(el('div', {
                    class: 'closing-message__eyebrow',
                    text: lang === 'hi' ? 'यात्रा पूरी हुई' : 'Journey complete'
                }));
                close.appendChild(el('h2', {
                    class: 'closing-message__title',
                    text: lang === 'hi'
                        ? 'आपने पूरे ' + totalDays + ' दिन पूरे किए।'
                        : 'You completed all ' + totalDays + ' days.'
                }));
                close.appendChild(el('p', {
                    class: 'closing-message__text',
                    text: lang === 'hi'
                        ? 'अभ्यास खत्म नहीं हुआ — बस इसका पहला अध्याय पूरा हुआ। एक और कोर्स लें, या अब अपने हिसाब से अभ्यास जारी रखें।'
                        : 'The practice is not finished — only its first chapter is. Take another course, or carry the practice forward on your own from here.'
                }));
                detail.appendChild(close);
            }

            main.appendChild(detail);
            wireDetailEvents(course);
        }

        function appendParagraphs(container, text) {
            String(text || '').split(/\n{2,}/).forEach(function (chunk) {
                var p = el('p');
                chunk.split(/\n/).forEach(function (line, i, arr) {
                    if (i > 0) p.appendChild(el('br'));
                    p.appendChild(document.createTextNode(line));
                });
                container.appendChild(p);
            });
        }

        function buildSessionRow(course, session, doneDays, nextDay) {
            var lang = currentLang();
            var day = session.day;
            var isComplete = doneDays.indexOf(day) !== -1;
            var isCurrent = !isComplete && day === nextDay;
            var openByDefault = isCurrent || day === 1;

            var row = el('div', {
                class: 'timeline-day' + (isComplete ? ' is-complete' : (isCurrent ? ' is-current' : '')),
                'data-day': String(day),
                'aria-expanded': openByDefault ? 'true' : 'false'
            });

            /* HEAD */
            var head = el('div', { class: 'timeline-day__head', role: 'button', tabindex: '0', 'data-toggle-day': String(day) });
            head.appendChild(el('span', { class: 'timeline-day__num', text: isComplete ? '✓' : String(day) }));

            var info = el('div', { class: 'timeline-day__info' });
            info.appendChild(el('h3', { class: 'timeline-day__title', text: pick(session, 'title') }));
            if (session.title_hi && lang === 'en') {
                info.appendChild(el('p', { class: 'timeline-day__title-hi', lang: 'hi', text: session.title_hi }));
            }
            head.appendChild(info);

            var headMeta = el('span', { class: 'timeline-day__meta' });
            headMeta.appendChild(document.createTextNode(fmtMinutes(session.duration_min || course.estimated_daily_minutes || 10)));
            headMeta.appendChild(el('span', {
                class: 'timeline-day__chevron', 'aria-hidden': 'true',
                html: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'
            }));
            head.appendChild(headMeta);
            row.appendChild(head);

            /* BODY */
            var body = el('div', { class: 'timeline-day__body' });

            if (session.intro_en || session.intro_hi) {
                body.appendChild(el('p', { class: 'timeline-day__intro', text: pick(session, 'intro') }));
            }

            var components = el('div', { class: 'timeline-day__components' });
            (session.components || []).forEach(function (c) {
                var compMeta = componentMeta(c.type);
                var typeLabel = lang === 'hi' ? compMeta.hi : compMeta.en;
                var comp = el('div', { class: 'timeline-day__component' });
                comp.appendChild(el('span', {
                    class: 'timeline-day__component-icon', 'aria-hidden': 'true',
                    html: compMeta.svg
                }));
                var info2 = el('div');
                info2.appendChild(el('div', { class: 'timeline-day__component-type', text: typeLabel }));
                info2.appendChild(el('div', { class: 'timeline-day__component-text', text: pick(c, 'notes') }));
                comp.appendChild(info2);
                comp.appendChild(el('span', { class: 'timeline-day__component-dur', text: fmtSeconds(c.duration_sec) }));
                components.appendChild(comp);
            });
            body.appendChild(components);

            /* REFLECTION */
            if (session.reflection_prompt_en || session.reflection_prompt_hi) {
                var saved = readJSON('sukoon_course_reflection__' + course.id + '__' + day, '');
                var refl = el('div', { class: 'timeline-day__reflection' });
                refl.appendChild(el('div', {
                    class: 'timeline-day__reflection-label',
                    text: lang === 'hi' ? 'चिंतन' : 'Reflection'
                }));
                refl.appendChild(el('p', {
                    class: 'timeline-day__reflection-prompt',
                    text: pick(session, 'reflection_prompt')
                }));
                var ta = el('textarea', {
                    class: 'timeline-day__reflection-input',
                    rows: '2',
                    'data-reflection-day': String(day),
                    placeholder: lang === 'hi' ? 'अपने विचार यहाँ लिखें…' : 'Write your thoughts here…'
                });
                ta.value = saved || '';
                refl.appendChild(ta);
                var actions = el('div', { class: 'timeline-day__reflection-actions' });
                actions.appendChild(el('button', {
                    type: 'button', class: 'timeline-day__reflection-save',
                    'data-save-reflection': String(day),
                    text: lang === 'hi' ? 'जर्नल में सहेजें' : 'Save to journal'
                }));
                actions.appendChild(el('span', {
                    class: 'timeline-day__reflection-saved',
                    'data-reflection-saved': String(day),
                    text: lang === 'hi' ? 'सहेज लिया' : 'Saved'
                }));
                refl.appendChild(actions);
                body.appendChild(refl);
            }

            /* BEGIN */
            var beginBtn = el('button', {
                type: 'button', class: 'timeline-day__begin',
                'data-begin-day': String(day)
            });
            beginBtn.appendChild(el('span', {
                'aria-hidden': 'true',
                html: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-14 9V3z" fill="currentColor"/></svg>'
            }));
            beginBtn.appendChild(document.createTextNode(
                isComplete
                    ? (lang === 'hi' ? 'फिर से करें' : 'Practice again')
                    : (lang === 'hi' ? 'दिन ' + day + ' शुरू करें' : 'Begin Day ' + day)
            ));
            body.appendChild(beginBtn);

            row.appendChild(body);
            return row;
        }

        function wireDetailEvents(course) {
            /* Back link */
            document.querySelectorAll('[data-back-link]').forEach(function (a) {
                a.addEventListener('click', function (e) {
                    e.preventDefault();
                    var url = new URL(window.location.href);
                    url.searchParams.delete('id');
                    history.pushState({}, '', url.toString());
                    mount();
                });
            });

            /* Intro language toggle */
            document.querySelectorAll('[data-intro-lang]').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var lang = btn.getAttribute('data-intro-lang');
                    document.querySelectorAll('[data-intro-lang]').forEach(function (b) {
                        b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
                    });
                    document.querySelectorAll('[data-intro-body]').forEach(function (n) {
                        n.style.display = n.getAttribute('data-intro-body') === lang ? '' : 'none';
                    });
                });
            });

            /* Accordion */
            document.querySelectorAll('[data-toggle-day]').forEach(function (head) {
                head.addEventListener('click', function () {
                    var row = head.closest('.timeline-day');
                    row.setAttribute('aria-expanded', row.getAttribute('aria-expanded') === 'true' ? 'false' : 'true');
                });
                head.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        head.click();
                    }
                });
            });

            /* Begin */
            document.querySelectorAll('[data-begin-day]').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var day = parseInt(btn.getAttribute('data-begin-day'), 10);
                    var session = (course.sessions || []).find(function (s) { return s.day === day; });
                    if (session) beginSession(course, session);
                });
            });

            /* Save reflection */
            document.querySelectorAll('[data-save-reflection]').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var day = parseInt(btn.getAttribute('data-save-reflection'), 10);
                    var input = document.querySelector('[data-reflection-day="' + day + '"]');
                    if (!input) return;
                    var text = (input.value || '').trim();
                    if (!text) return;
                    var session = (course.sessions || []).find(function (s) { return s.day === day; });
                    var prompt = session ? pick(session, 'reflection_prompt') : '';
                    writeJSON('sukoon_course_reflection__' + course.id + '__' + day, text);
                    saveJournalEntry({
                        id: 'course-' + course.id + '-day-' + day + '-' + Date.now(),
                        kind: 'course_reflection',
                        courseId: course.id,
                        courseTitle: pick(course, 'title'),
                        day: day,
                        prompt: prompt,
                        body: text,
                        createdAt: new Date().toISOString(),
                        lang: currentLang()
                    });
                    var saved = document.querySelector('[data-reflection-saved="' + day + '"]');
                    if (saved) {
                        saved.classList.add('is-shown');
                        setTimeout(function () { saved.classList.remove('is-shown'); }, 2400);
                    }
                });
            });
        }

        /* ============ BEGIN SESSION (player) ============ */
        function beginSession(course, session) {
            var lang = currentLang();
            var chapters = (session.components || []).map(function (c) {
                var meta = componentMeta(c.type);
                return {
                    title_en: meta.en + (c.ref_id ? ' · ' + c.ref_id : ''),
                    title_hi: meta.hi + (c.ref_id ? ' · ' + c.ref_id : ''),
                    text_en: c.notes_en || '',
                    text_hi: c.notes_hi || ''
                };
            });

            var item = {
                id: 'course-' + course.id + '-day-' + session.day,
                title_en: pick(course, 'title') + ' — Day ' + session.day + ': ' + (session.title_en || ''),
                title_hi: pick(course, 'title') + ' — दिन ' + session.day + ': ' + (session.title_hi || ''),
                chapters: chapters,
                script_en: (session.intro_en ? session.intro_en + '\n\n' : '') +
                           (session.components || []).map(function (c) { return c.notes_en || ''; }).join('\n\n'),
                script_hi: (session.intro_hi ? session.intro_hi + '\n\n' : '') +
                           (session.components || []).map(function (c) { return c.notes_hi || ''; }).join('\n\n'),
                voice_register: 'gentle',
                __courseId: course.id,
                __day: session.day
            };

            if (window.SukoonPlayer) {
                try {
                    var player = new window.SukoonPlayer({ lang: lang });
                    var orig = player._onComplete && player._onComplete.bind(player);
                    player._onComplete = function () {
                        if (orig) orig();
                        markDayComplete(course.id, session.day);
                    };
                    player.open(item);
                } catch (_err) {
                    markDayComplete(course.id, session.day);
                    notifyComplete(course, session, lang);
                }
            } else {
                markDayComplete(course.id, session.day);
                notifyComplete(course, session, lang);
            }
            setTimeout(function () { mount(); }, 0);
        }
        function notifyComplete(course, session, lang) {
            try {
                alert(lang === 'hi'
                    ? 'खिलाड़ी अभी उपलब्ध नहीं है। दिन ' + session.day + ' को पूर्ण के रूप में चिह्नित किया गया।'
                    : 'Player not available. Day ' + session.day + ' marked complete.');
            } catch (_) {}
        }

        /* ============ NAV ============ */
        function navigateToCourse(id) {
            var url = new URL(window.location.href);
            url.searchParams.set('id', id);
            history.pushState({}, '', url.toString());
            window.scrollTo({ top: 0, behavior: 'auto' });
            mount();
        }
        window.addEventListener('popstate', function () { mount(); });

        /* ============ MOUNT ============ */
        var __courses = null;
        function mount() {
            var main = document.getElementById('coursesMain');
            if (!main) return;
            var params = new URLSearchParams(window.location.search);
            var id = params.get('id');

            function ready(courses) {
                __courses = courses;
                if (!courses.length) {
                    clear(main);
                    main.appendChild(el('div', {
                        class: 'empty-state',
                        text: currentLang() === 'hi'
                            ? 'कोर्स अभी उपलब्ध नहीं हैं। कृपया बाद में आज़माएँ।'
                            : 'Courses unavailable right now. Please try again later.'
                    }));
                    return;
                }
                if (id) {
                    var course = courses.find(function (c) { return c.id === id; });
                    if (course) { renderDetail(course); return; }
                }
                renderCatalog(courses);
            }

            if (__courses) {
                ready(__courses);
            } else {
                loadCourses().then(ready).catch(function () {
                    clear(main);
                    main.appendChild(el('div', {
                        class: 'empty-state',
                        text: currentLang() === 'hi'
                            ? 'कोर्स लोड नहीं हो सके। नेटवर्क जाँचें।'
                            : 'Could not load courses. Check your connection.'
                    }));
                });
            }
        }
        window.__sukoonCoursesMount = mount;

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', mount);
        } else {
            mount();
        }

    })();
    </script>
</body>
</html>
