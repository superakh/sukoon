<!DOCTYPE html>
<html lang="en" data-tod="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sukoon — A sanctuary for the heavy moments.</title>
    <meta name="description" content="No signup. No tracking. Tell Sukoon what's heavy — it will quietly take you to the right place.">
    <meta name="theme-color" content="#0F1B3D">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icons/icon-192.svg" type="image/svg+xml">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Sukoon">
    <meta property="og:url" content="https://sukoon.cloud/">
    <meta property="og:title" content="Sukoon — A sanctuary for the heavy moments.">
    <meta property="og:description" content="Tell Sukoon what's heavy. It will quietly take you where your heart needs to go.">
    <meta property="og:image" content="https://sukoon.cloud/og/home.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Tiro+Devanagari+Hindi&family=Inter+Tight:wght@400;500;600&family=Hind:wght@400;500&display=swap">
    <link rel="stylesheet" href="/css/shell.css">
    <link rel="stylesheet" href="/css/sukoon-revolution.css">
    <script src="/js/sukoon-experience.js" defer></script>
    <script src="/js/sukoon-pulse.js" defer></script>
    <script src="/js/sukoon-safety.js" defer></script>
    <script src="/js/sukoon-library.js" defer></script>
    <script src="/js/sukoon-router.js" defer></script>

    <style>
    /* ─── ENTRY DIALOGUE — minimal, cinematic, mobile-first ─────────────── */
    :root {
        --ink: #F5E9D3;
        --ink-soft: rgba(245, 233, 211, 0.72);
        --ink-faint: rgba(245, 233, 211, 0.42);
        --glow: rgba(245, 233, 211, 0.14);
        --glow-strong: rgba(245, 233, 211, 0.28);
        --crisis: #C9B4FF;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    html, body { margin: 0; padding: 0; background: #050810; color: var(--ink); font-family: 'Fraunces', Georgia, serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    body.page-entry { min-height: 100vh; min-height: 100dvh; overflow: hidden; }

    /* ── Cinematic backdrop ── */
    .sk-stage {
        position: fixed; inset: 0; z-index: 0;
        overflow: hidden; background: #050810;
    }
    .sk-stage__video {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; opacity: 0;
        transition: opacity 1.6s ease;
    }
    .sk-stage__video.is-active { opacity: 1; }
    .sk-stage__veil {
        position: absolute; inset: 0;
        background:
            radial-gradient(ellipse at 50% 30%, transparent 0%, rgba(5,8,16,0.35) 55%, rgba(5,8,16,0.82) 100%),
            linear-gradient(to bottom, rgba(5,8,16,0.55) 0%, rgba(5,8,16,0.15) 35%, rgba(5,8,16,0.78) 100%);
        pointer-events: none;
    }
    html[data-tod="dusk"] .sk-stage__veil { background:
        radial-gradient(ellipse at 50% 25%, rgba(214,148,90,0.10) 0%, rgba(5,8,16,0.45) 55%, rgba(5,8,16,0.85) 100%),
        linear-gradient(to bottom, rgba(20,12,30,0.55) 0%, rgba(5,8,16,0.20) 40%, rgba(5,8,16,0.82) 100%);
    }
    html[data-tod="night"] .sk-stage__veil { background:
        radial-gradient(ellipse at 50% 25%, rgba(80,98,180,0.10) 0%, rgba(5,8,16,0.55) 55%, rgba(5,8,16,0.88) 100%),
        linear-gradient(to bottom, rgba(5,8,16,0.70) 0%, rgba(5,8,16,0.30) 40%, rgba(5,8,16,0.88) 100%);
    }

    /* ── Crisis bar (persistent, top) ── */
    .sk-crisis-bar {
        position: fixed; top: 0; left: 0; right: 0; z-index: 50;
        padding: calc(var(--safe-top) + 9px) 16px 9px;
        background: rgba(15, 12, 30, 0.55);
        backdrop-filter: blur(14px) saturate(1.2);
        -webkit-backdrop-filter: blur(14px) saturate(1.2);
        border-bottom: 1px solid rgba(201, 180, 255, 0.18);
        text-align: center;
        font: 500 12.5px/1.35 'Inter Tight', system-ui, sans-serif;
        letter-spacing: 0.01em;
        color: var(--crisis);
        text-decoration: none;
        display: flex; align-items: center; justify-content: center; gap: 8px;
        transition: background 0.3s ease;
    }
    .sk-crisis-bar:hover { background: rgba(25, 20, 50, 0.72); }
    .sk-crisis-bar__dot { width: 6px; height: 6px; border-radius: 50%; background: var(--crisis); box-shadow: 0 0 10px rgba(201,180,255,0.7); animation: skPulseDot 2.4s ease-in-out infinite; }
    .sk-crisis-bar__text strong { font-weight: 600; }
    .sk-crisis-bar__arrow { opacity: 0.7; margin-left: 2px; }
    @keyframes skPulseDot { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.85); } }

    /* ── Lang toggle, top-right ── */
    .sk-lang {
        position: fixed; top: calc(var(--safe-top) + 44px); right: 14px; z-index: 40;
        background: rgba(15,12,30,0.4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(245,233,211,0.14);
        border-radius: 999px; padding: 6px 14px;
        font: 500 11.5px/1 'Inter Tight', system-ui, sans-serif; color: var(--ink-soft);
        letter-spacing: 0.04em; text-transform: uppercase;
        cursor: pointer; appearance: none; -webkit-appearance: none;
    }
    .sk-lang:focus { outline: none; border-color: rgba(245,233,211,0.36); }

    /* ── Brand mark, top-left ── */
    .sk-brand {
        position: fixed; top: calc(var(--safe-top) + 44px); left: 18px; z-index: 40;
        font: 400 19px/1 'Fraunces', Georgia, serif;
        color: var(--ink); letter-spacing: 0.10em; text-decoration: none;
        text-transform: lowercase; opacity: 0.92;
    }
    .sk-brand::before { content: '✦'; margin-right: 8px; opacity: 0.7; }

    /* ── Entry dialogue centerpiece ── */
    .sk-entry {
        position: relative; z-index: 10;
        min-height: 100vh; min-height: 100dvh;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        padding: calc(var(--safe-top) + 88px) 22px calc(var(--safe-bottom) + 112px);
        text-align: center;
    }
    .sk-entry__inner { width: 100%; max-width: 620px; }

    .sk-prompt {
        font: 300 clamp(26px, 5.2vw, 40px)/1.28 'Fraunces', Georgia, serif;
        color: var(--ink); letter-spacing: -0.005em;
        margin: 0 0 10px;
        opacity: 0; transform: translateY(14px);
        animation: skFadeUp 1.6s cubic-bezier(.2,.7,.2,1) 0.2s forwards;
    }
    .sk-prompt__bullet { display: inline-block; margin: 0 8px; color: var(--ink-faint); font-size: 0.78em; vertical-align: middle; }
    .sk-prompt__hi {
        display: block; margin-top: 8px;
        font: 400 clamp(17px, 3.4vw, 22px)/1.4 'Tiro Devanagari Hindi', 'Hind', serif;
        color: var(--ink-soft); letter-spacing: 0.005em;
    }
    @keyframes skFadeUp { to { opacity: 1; transform: translateY(0); } }

    /* ── Input field ── */
    .sk-entry__form {
        position: relative; margin: 32px auto 0; width: 100%;
        opacity: 0; transform: translateY(14px);
        animation: skFadeUp 1.6s cubic-bezier(.2,.7,.2,1) 0.6s forwards;
    }
    .sk-input-wrap {
        position: relative;
        background: rgba(20, 18, 40, 0.42);
        backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4);
        border: 1px solid rgba(245, 233, 211, 0.18);
        border-radius: 22px;
        padding: 4px 4px 4px 22px;
        display: flex; align-items: center; gap: 10px;
        box-shadow:
            0 0 0 1px rgba(245,233,211,0.04),
            0 20px 60px rgba(0,0,0,0.45),
            inset 0 1px 0 rgba(245,233,211,0.06);
        transition: border-color 0.4s ease, box-shadow 0.4s ease, background 0.4s ease;
        animation: skSoftGlow 5.5s ease-in-out infinite;
    }
    .sk-input-wrap:focus-within {
        border-color: rgba(245,233,211,0.42);
        background: rgba(28, 24, 52, 0.55);
        box-shadow:
            0 0 0 1px rgba(245,233,211,0.1),
            0 0 48px rgba(245,233,211,0.10),
            0 24px 72px rgba(0,0,0,0.55);
        animation: none;
    }
    @keyframes skSoftGlow {
        0%, 100% { box-shadow: 0 0 0 1px rgba(245,233,211,0.04), 0 20px 60px rgba(0,0,0,0.45), 0 0 0 0 rgba(245,233,211,0); }
        50%      { box-shadow: 0 0 0 1px rgba(245,233,211,0.08), 0 20px 60px rgba(0,0,0,0.45), 0 0 36px rgba(245,233,211,0.06); }
    }

    .sk-input {
        flex: 1; min-width: 0;
        background: transparent; border: 0; outline: none;
        font: 400 17.5px/1.45 'Fraunces', Georgia, serif;
        color: var(--ink); padding: 18px 0;
        caret-color: var(--ink);
    }
    .sk-input::placeholder { color: var(--ink-faint); font-style: italic; font-weight: 300; }

    .sk-iconbtn {
        flex: 0 0 auto;
        width: 46px; height: 46px;
        background: rgba(245,233,211,0.06);
        border: 1px solid rgba(245,233,211,0.14);
        border-radius: 50%;
        display: inline-flex; align-items: center; justify-content: center;
        color: var(--ink-soft); cursor: pointer;
        transition: all 0.25s ease;
    }
    .sk-iconbtn:hover { background: rgba(245,233,211,0.12); color: var(--ink); border-color: rgba(245,233,211,0.28); }
    .sk-iconbtn:focus-visible { outline: 2px solid rgba(245,233,211,0.4); outline-offset: 2px; }
    .sk-iconbtn svg { width: 18px; height: 18px; }
    .sk-iconbtn--send { background: rgba(245,233,211,0.92); color: #0F1B3D; border-color: rgba(245,233,211,1); }
    .sk-iconbtn--send:hover { background: #fff; color: #0F1B3D; }
    .sk-iconbtn--send:disabled { opacity: 0.45; cursor: default; }
    .sk-iconbtn--mic.is-listening {
        background: rgba(201,180,255,0.22); border-color: rgba(201,180,255,0.5); color: var(--crisis);
        animation: skMicPulse 1.4s ease-in-out infinite;
    }
    @keyframes skMicPulse {
        0%,100% { box-shadow: 0 0 0 0 rgba(201,180,255,0.45); }
        50%     { box-shadow: 0 0 0 10px rgba(201,180,255,0); }
    }

    /* ── Quick chips ── */
    .sk-chips {
        margin: 22px auto 0;
        display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
        opacity: 0; transform: translateY(10px);
        animation: skFadeUp 1.6s cubic-bezier(.2,.7,.2,1) 1.0s forwards;
    }
    .sk-chip {
        background: rgba(245,233,211,0.05);
        border: 1px solid rgba(245,233,211,0.16);
        border-radius: 999px;
        padding: 9px 16px;
        font: 400 13.5px/1 'Inter Tight', system-ui, sans-serif;
        color: var(--ink-soft); cursor: pointer;
        letter-spacing: 0.01em;
        transition: all 0.2s ease;
    }
    .sk-chip:hover { background: rgba(245,233,211,0.12); color: var(--ink); border-color: rgba(245,233,211,0.32); transform: translateY(-1px); }
    .sk-chip:active { transform: translateY(0); }

    .sk-hint {
        margin: 18px 0 0;
        font: 400 12.5px/1.4 'Inter Tight', system-ui, sans-serif;
        color: var(--ink-faint); letter-spacing: 0.02em;
    }

    /* ── Listening / routing state ── */
    .sk-listening {
        position: fixed; inset: 0; z-index: 90;
        display: none; align-items: center; justify-content: center;
        background: rgba(5,8,16,0.78); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        opacity: 0; transition: opacity 0.5s ease;
    }
    .sk-listening.is-open { display: flex; opacity: 1; }
    .sk-listening__inner { text-align: center; }
    .sk-breath-orb {
        width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 28px;
        background: radial-gradient(circle, rgba(245,233,211,0.32) 0%, rgba(245,233,211,0.08) 55%, transparent 75%);
        animation: skBreath 4.6s ease-in-out infinite;
    }
    @keyframes skBreath {
        0%,100% { transform: scale(0.85); opacity: 0.55; }
        50%     { transform: scale(1.15); opacity: 1; }
    }
    .sk-listening__text {
        font: 300 19px/1.4 'Fraunces', Georgia, serif;
        color: var(--ink); letter-spacing: 0.01em;
    }
    .sk-listening__hi {
        display: block; margin-top: 4px;
        font: 400 15px/1.4 'Tiro Devanagari Hindi', serif;
        color: var(--ink-soft);
    }

    /* ── Pulse ticker (bottom, above nav) ── */
    .sk-pulse {
        position: fixed; left: 0; right: 0;
        bottom: calc(72px + var(--safe-bottom) + 8px);
        z-index: 20;
        display: flex; align-items: center; justify-content: center; gap: 8px;
        font: 400 12px/1 'Inter Tight', system-ui, sans-serif;
        color: var(--ink-faint); letter-spacing: 0.04em;
        text-transform: lowercase;
        pointer-events: none;
        opacity: 0; animation: skFadeUp 2s ease 1.4s forwards;
    }
    .sk-pulse__dot {
        width: 6px; height: 6px; border-radius: 50%; background: var(--ink-soft);
        box-shadow: 0 0 12px rgba(245,233,211,0.45);
        animation: skPulseDot 3.2s ease-in-out infinite;
    }
    .sk-pulse__count { color: var(--ink-soft); font-weight: 500; }

    /* ── Bottom nav (5 tabs + floating SOS) ── */
    .sk-bottom-nav {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
        padding: 8px 4px calc(var(--safe-bottom) + 8px);
        background: rgba(8, 10, 22, 0.78);
        backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4);
        border-top: 1px solid rgba(245,233,211,0.10);
        display: grid; grid-template-columns: repeat(5, 1fr);
    }
    .sk-bottom-nav__item {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
        padding: 8px 4px;
        text-decoration: none;
        color: var(--ink-faint);
        font: 500 10.5px/1 'Inter Tight', system-ui, sans-serif;
        letter-spacing: 0.04em;
        transition: color 0.25s ease;
    }
    .sk-bottom-nav__item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; }
    .sk-bottom-nav__item:hover, .sk-bottom-nav__item.is-active { color: var(--ink); }
    .sk-bottom-nav__item.is-active::after {
        content: ''; position: absolute; transform: translateY(28px);
        width: 4px; height: 4px; border-radius: 50%; background: var(--ink);
    }

    .sk-sos-float {
        position: fixed; right: 18px; bottom: calc(86px + var(--safe-bottom));
        z-index: 35;
        width: 54px; height: 54px; border-radius: 50%;
        background: linear-gradient(135deg, #C9B4FF 0%, #8A6FE6 100%);
        color: #1A0F3D;
        display: inline-flex; align-items: center; justify-content: center;
        text-decoration: none;
        box-shadow: 0 12px 32px rgba(138,111,230,0.45), 0 0 0 0 rgba(201,180,255,0.7);
        animation: skSosPulse 2.6s ease-in-out infinite;
        transition: transform 0.2s ease;
    }
    .sk-sos-float:hover { transform: scale(1.06); }
    .sk-sos-float svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; }
    @keyframes skSosPulse {
        0%,100% { box-shadow: 0 12px 32px rgba(138,111,230,0.45), 0 0 0 0 rgba(201,180,255,0.55); }
        50%     { box-shadow: 0 12px 32px rgba(138,111,230,0.45), 0 0 0 14px rgba(201,180,255,0); }
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }

    /* ── Tight phones ── */
    @media (max-height: 640px) {
        .sk-entry { padding-top: calc(var(--safe-top) + 72px); }
        .sk-prompt { font-size: 22px; }
        .sk-entry__form { margin-top: 22px; }
        .sk-chips { margin-top: 16px; }
    }
    </style>
</head>
<body class="page-entry" data-experience="entry">

    <!-- ════════════════════════════════════════════════════════════════
         CRISIS BAR  (persistent on every page)
         ════════════════════════════════════════════════════════════════ -->
    <a class="sk-crisis-bar" href="/now.html" aria-label="Crisis support — go to Sukoon Now">
        <span class="sk-crisis-bar__dot" aria-hidden="true"></span>
        <span class="sk-crisis-bar__text">If this hour is heavy, <strong>sukoon.cloud/now</strong> is one tap away.</span>
        <span class="sk-crisis-bar__arrow" aria-hidden="true">→</span>
    </a>

    <!-- Brand mark + language toggle -->
    <a href="/" class="sk-brand" aria-label="Sukoon">sukoon</a>
    <select class="sk-lang" id="skLang" aria-label="Language">
        <option value="en">EN · HI</option>
        <option value="hi">HI · EN</option>
        <option value="en-only">English</option>
        <option value="hi-only">हिंदी</option>
    </select>

    <!-- ════════════════════════════════════════════════════════════════
         CINEMATIC BACKDROP (time-of-day aware)
         ════════════════════════════════════════════════════════════════ -->
    <div class="sk-stage" aria-hidden="true">
        <video class="sk-stage__video" id="skVidDay"   src="/video/hero-day.mp4"   muted playsinline loop preload="metadata"></video>
        <video class="sk-stage__video" id="skVidDusk"  src="/video/hero-dusk.mp4"  muted playsinline loop preload="metadata"></video>
        <video class="sk-stage__video" id="skVidNight" src="/video/hero-night.mp4" muted playsinline loop preload="metadata"></video>
        <video class="sk-stage__video" id="skVidHome"  src="/video/hero-home.mp4"  muted playsinline loop preload="metadata"></video>
        <div class="sk-stage__veil"></div>
    </div>

    <!-- ════════════════════════════════════════════════════════════════
         ENTRY DIALOGUE
         ════════════════════════════════════════════════════════════════ -->
    <main class="sk-entry">
        <div class="sk-entry__inner">

            <h1 class="sk-prompt" id="skPrompt">
                <span id="skPromptEn">Welcome. <span class="sk-prompt__bullet">✦</span> What's heavy right now?</span>
                <span class="sk-prompt__hi" lang="hi" id="skPromptHi">आइए · अभी मन पर क्या भारी है?</span>
            </h1>

            <form class="sk-entry__form" id="skForm" autocomplete="off" novalidate>
                <div class="sk-input-wrap">
                    <input
                        class="sk-input"
                        id="skInput"
                        type="text"
                        name="phrase"
                        inputmode="text"
                        autocapitalize="sentences"
                        spellcheck="false"
                        placeholder="Say anything. A word is enough."
                        aria-label="Tell Sukoon what's heavy"
                    >
                    <button type="button" class="sk-iconbtn sk-iconbtn--mic" id="skMic" aria-label="Speak instead of typing" title="Tap to speak">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="3" width="6" height="11" rx="3"/>
                            <path d="M5 11a7 7 0 0 0 14 0"/>
                            <line x1="12" y1="18" x2="12" y2="22"/>
                            <line x1="9" y1="22" x2="15" y2="22"/>
                        </svg>
                    </button>
                    <button type="submit" class="sk-iconbtn sk-iconbtn--send" id="skSend" aria-label="Listen to me" title="Listen">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"/>
                            <polyline points="13 6 19 12 13 18"/>
                        </svg>
                    </button>
                </div>
            </form>

            <div class="sk-chips" role="group" aria-label="Quick feelings">
                <button type="button" class="sk-chip" data-chip="Just anxious">Just anxious</button>
                <button type="button" class="sk-chip" data-chip="Can't sleep">Can't sleep</button>
                <button type="button" class="sk-chip" data-chip="Sad">Sad</button>
            </div>

            <p class="sk-hint" id="skHint">No signup. No account. Sukoon doesn't remember.</p>
        </div>
    </main>

    <!-- ════════════════════════════════════════════════════════════════
         LIVE PULSE TICKER
         ════════════════════════════════════════════════════════════════ -->
    <div class="sk-pulse" id="skPulse" role="status" aria-live="polite">
        <span class="sk-pulse__dot" aria-hidden="true"></span>
        <span><span class="sk-pulse__count" id="skPulseCount">—</span> &nbsp;hearts finding sukoon right now</span>
    </div>

    <!-- ════════════════════════════════════════════════════════════════
         LISTENING / ROUTING OVERLAY
         ════════════════════════════════════════════════════════════════ -->
    <div class="sk-listening" id="skListening" aria-hidden="true">
        <div class="sk-listening__inner">
            <div class="sk-breath-orb" aria-hidden="true"></div>
            <p class="sk-listening__text" id="skListeningText">
                Sukoon is listening…
                <span class="sk-listening__hi" lang="hi">सुकून सुन रहा है…</span>
            </p>
        </div>
    </div>

    <!-- ════════════════════════════════════════════════════════════════
         FLOATING SOS BUTTON
         ════════════════════════════════════════════════════════════════ -->
    <a class="sk-sos-float" href="/now.html" aria-label="Crisis support — tap for help">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">

    <!-- ════════════════════════════════════════════════════════════════
         ENTRY DIALOGUE LOGIC
         ════════════════════════════════════════════════════════════════ -->
    <script>
    (function () {
        'use strict';

        // ─── Time-of-day backdrop ──────────────────────────────────────
        function pickTod() {
            var h = new Date().getHours();
            if (h >= 5 && h < 17) return 'day';
            if (h >= 17 && h < 20) return 'dusk';
            return 'night';
        }
        var tod = pickTod();
        document.documentElement.setAttribute('data-tod', tod);

        var vidDay   = document.getElementById('skVidDay');
        var vidDusk  = document.getElementById('skVidDusk');
        var vidNight = document.getElementById('skVidNight');
        var vidHome  = document.getElementById('skVidHome');
        var byTod = { day: vidDay, dusk: vidDusk, night: vidNight };
        var chosen = byTod[tod] || vidHome;

        function activate(v) {
            if (!v) return;
            v.classList.add('is-active');
            var play = v.play();
            if (play && typeof play.catch === 'function') play.catch(function () { /* autoplay denied; static frame is fine */ });
        }
        // Try the time-matched video; if its source fails, fall back to /video/hero-home.mp4
        chosen.addEventListener('loadeddata', function () { activate(chosen); }, { once: true });
        chosen.addEventListener('error', function () { activate(vidHome); }, { once: true });
        // Kick metadata load
        try { chosen.load(); } catch (_) {}
        // Safety: if neither fires within 1.4s, just activate something
        setTimeout(function () {
            if (!chosen.classList.contains('is-active') && !vidHome.classList.contains('is-active')) {
                activate(vidHome);
            }
        }, 1400);

        // ─── Pulse ticker  (graceful fallback) ─────────────────────────
        var pulseEl = document.getElementById('skPulseCount');
        function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
        function fetchPulse() {
            fetch('/api/pulse', { headers: { 'accept': 'application/json' }, cache: 'no-store' })
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (j) {
                    if (!j) return;
                    var n = (j.count != null ? j.count : (j.pulse != null ? j.pulse : j.souls));
                    if (typeof n === 'number' && isFinite(n)) pulseEl.textContent = fmt(n);
                })
                .catch(function () { /* offline / dev — show a soft default */ });
        }
        // Soft default while fetching
        pulseEl.textContent = fmt(170 + Math.floor(Math.random() * 40));
        fetchPulse();
        setInterval(fetchPulse, 18000);

        // ─── Language toggle (persisted to localStorage) ───────────────
        var langSel = document.getElementById('skLang');
        var promptHi = document.getElementById('skPromptHi');
        var promptEn = document.getElementById('skPromptEn');
        try {
            var savedLang = localStorage.getItem('sukoon_lang') || 'en';
            langSel.value = savedLang;
        } catch (_) {}
        function applyLang() {
            var v = langSel.value;
            if (v === 'en-only') { promptHi.style.display = 'none'; promptEn.style.display = ''; document.documentElement.lang = 'en'; }
            else if (v === 'hi-only') { promptHi.style.display = ''; promptEn.style.display = 'none'; document.documentElement.lang = 'hi'; }
            else { promptHi.style.display = ''; promptEn.style.display = ''; document.documentElement.lang = (v === 'hi' ? 'hi' : 'en'); }
            try { localStorage.setItem('sukoon_lang', v); } catch (_) {}
        }
        applyLang();
        langSel.addEventListener('change', applyLang);

        // ─── Entry form + router ───────────────────────────────────────
        var form     = document.getElementById('skForm');
        var input    = document.getElementById('skInput');
        var micBtn   = document.getElementById('skMic');
        var sendBtn  = document.getElementById('skSend');
        var listenEl = document.getElementById('skListening');
        var listenText = document.getElementById('skListeningText');

        // Desktop autofocus only (avoid surprising the mobile keyboard)
        if (window.matchMedia && window.matchMedia('(pointer: fine)').matches) {
            setTimeout(function () { try { input.focus({ preventScroll: true }); } catch (_) { input.focus(); } }, 900);
        }

        // Quick chips → prefill input (do NOT auto-submit; user re-affirms)
        document.querySelectorAll('.sk-chip').forEach(function (chip) {
            chip.addEventListener('click', function () {
                input.value = chip.getAttribute('data-chip') || chip.textContent.trim();
                input.focus();
            });
        });

        // ─── Routing destinations (used when /api/route is unavailable) ─
        var SAFE_FALLBACKS = {
            anxious:  '/breathe.html?p=478',
            anxiety:  '/breathe.html?p=478',
            panic:    '/breathe.html?p=478',
            sleep:    '/rest.html',
            sleepless:'/rest.html',
            tired:    '/rest.html',
            insomnia: '/rest.html',
            sad:      '/be-with-me.html',
            lonely:   '/be-with-me.html',
            heavy:    '/be-with-me.html',
            angry:    '/breathe.html?p=478',
            calm:     '/sit.html',
            quiet:    '/sit.html',
            focus:    '/sit.html',
            stress:   '/breathe.html?p=478',
            grief:    '/be-with-me.html'
        };
        function localGuess(phrase) {
            var s = (phrase || '').toLowerCase();
            // simple keyword spotter as last-resort fallback
            var keys = Object.keys(SAFE_FALLBACKS);
            for (var i = 0; i < keys.length; i++) {
                if (s.indexOf(keys[i]) !== -1) return SAFE_FALLBACKS[keys[i]];
            }
            // default: a conversation with Friend
            return '/be-with-me.html';
        }

        function showListening(open) {
            listenEl.classList.toggle('is-open', !!open);
            listenEl.setAttribute('aria-hidden', open ? 'false' : 'true');
        }

        function setListeningCopy(en, hi) {
            listenText.innerHTML = en + '<span class="sk-listening__hi" lang="hi">' + hi + '</span>';
        }

        function navigateTo(href, phrase) {
            var url = href;
            if (phrase) {
                // pass phrase via hash so back/forward + server stays clean
                var hash = '#q=' + encodeURIComponent(phrase);
                url = href.indexOf('#') === -1 ? (href + hash) : (href + '&' + hash.slice(1));
            }
            // brief breath, then go
            setTimeout(function () { window.location.href = url; }, 700);
        }

        // Wire router if available; otherwise local fallback
        var router = null;
        function ensureRouter() {
            if (router) return router;
            if (window.SukoonRouter) {
                try {
                    router = new window.SukoonRouter({
                        lang: (document.documentElement.lang || 'en'),
                        onCrisis: function () {
                            setListeningCopy('I hear you. Help is one tap away.', 'मैं सुन रहा हूँ। मदद यहीं है।');
                            showListening(true);
                            navigateTo('/now.html');
                        },
                        onRoute: function (result) {
                            var dest = (result && (result.href || result.url || result.path)) || null;
                            if (!dest && result && result.experience) {
                                var map = { meditation: '/sit.html', story: '/rest.html', breath: '/breathe.html', friend: '/be-with-me.html', crisis: '/now.html' };
                                dest = map[result.experience] || null;
                            }
                            if (!dest) dest = localGuess(input.value);
                            navigateTo(dest, input.value);
                        }
                    });
                } catch (e) { router = null; }
            }
            return router;
        }

        // ─── Submit ──────────────────────────────────────────────────
        form.addEventListener('submit', function (ev) {
            ev.preventDefault();
            var phrase = (input.value || '').trim();
            if (!phrase) { input.focus(); return; }

            // Track for resume / continuity (not for tracking — local only)
            try { sessionStorage.setItem('sukoon_entry_phrase', phrase); } catch (_) {}

            // Show breath while routing
            setListeningCopy('Sukoon is listening…', 'सुकून सुन रहा है…');
            showListening(true);

            var r = ensureRouter();
            if (r && typeof r.route === 'function') {
                try { r.route(phrase); return; } catch (_) {}
            }
            // Local guess if router missing
            setTimeout(function () { navigateTo(localGuess(phrase), phrase); }, 600);
        });

        // ─── Mic (Web Speech API) ────────────────────────────────────
        var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        var recognizer = null;
        var listening = false;
        if (!SpeechRec) {
            micBtn.title = 'Voice input not supported in this browser';
            micBtn.style.opacity = '0.45';
        }
        micBtn.addEventListener('click', function () {
            if (!SpeechRec) return;
            if (listening) { try { recognizer.stop(); } catch (_) {} return; }
            try {
                recognizer = new SpeechRec();
                var lang = (document.documentElement.lang === 'hi') ? 'hi-IN' : 'en-IN';
                recognizer.lang = lang;
                recognizer.interimResults = true;
                recognizer.maxAlternatives = 1;
                recognizer.continuous = false;

                recognizer.onstart = function () {
                    listening = true;
                    micBtn.classList.add('is-listening');
                    micBtn.setAttribute('aria-label', 'Stop listening');
                };
                recognizer.onresult = function (e) {
                    var txt = '';
                    for (var i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
                    input.value = txt;
                };
                recognizer.onerror = function () { /* graceful */ };
                recognizer.onend = function () {
                    listening = false;
                    micBtn.classList.remove('is-listening');
                    micBtn.setAttribute('aria-label', 'Speak instead of typing');
                    var v = (input.value || '').trim();
                    if (v.length > 1) {
                        // small pause for the user to read what was heard, then submit
                        setTimeout(function () { form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event('submit', { cancelable: true })); }, 350);
                    }
                };
                recognizer.start();
            } catch (_) { listening = false; micBtn.classList.remove('is-listening'); }
        });

        // Enter submits, Esc clears
        input.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') { input.value = ''; }
        });

    })();
    </script>

    <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function(){});</script>
